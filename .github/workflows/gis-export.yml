name: GIS export

# Runs basin_layers.py (Saskatchewan/Alberta ArcGIS pulls + SMDI scrape) on
# GitHub's own servers instead of a laptop. The cloud container and
# device sandbox used earlier in this project are blocked from
# gis.saskatchewan.ca and the Alberta GIS hosts by an egress allowlist;
# GitHub Actions runners are not behind that allowlist. No machine
# needs to stay awake for this to run - see claude/open-items.md and
# claude/claim-monitor-state.md ("Standing PATH bug") for the fragile
# Windows Scheduled Task this replaces.
#
# On success: merges the fresh geoscience layers into data/bundle.json and
# pushes. That push triggers Cloudflare's existing git-connected rebuild -
# no separate deploy step needed here.

on:
  schedule:
    # 07:30 America/Regina. Saskatchewan does not observe DST (fixed
    # UTC-6 year-round), so this cron is correct every day of the year
    # with no seasonal adjustment needed.
    - cron: "30 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run basin_layers.py
        working-directory: gis
        run: python basin_layers.py

      - name: Merge into data/bundle.json
        run: python scripts/merge_map_bundle.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "basin-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bundle.json gis/exports/ab_state.json gis/exports/lapsed_state.json gis/exports/smdi_grade_cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily GIS export refresh ($(date -u +%Y-%m-%d))"
            git push
          fi
